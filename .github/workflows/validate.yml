name: Validate Emacs DevKit

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate shell scripts
        run: bash -n install.sh verify.sh rollback.sh
      - name: Validate Emacs Lisp syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          for file in config/*.el scripts/*.el; do
            emacs --batch -Q --eval "(with-temp-buffer (insert-file-contents \"$file\") (check-parens))"
          done
